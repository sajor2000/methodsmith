name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Superseded runs on the same ref are cancelled; main is never cancelled so
# every merged commit keeps a complete status history.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          types: |
            feat
            fix
            docs
            refactor
            chore
            test
            ci
            build
            perf
            revert

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: legacy-registry-coverage.test.ts walks `git log
          # --diff-filter=D` for deleted components. A shallow clone sees no
          # history, so the coverage guard would pass vacuously in the exact
          # check that gates merges.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: an unpinned toolchain can break main with no repo change.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install documentation dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Build documentation
        working-directory: website
        run: bun run build

      - name: Install Python test dependencies
        run: python3 -m pip install "openpyxl>=3.1,<4" "nbformat>=5.10,<6" "nbclient>=0.10,<1" "ipykernel>=6,<8" "PyYAML>=6,<7"

      - name: Setup base R for uncertainty regression tests
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.5.0'

      - name: Require numerical test runtime
        run: Rscript --version

      - name: Typecheck
        run: bun run typecheck

      - name: Validate release metadata
        run: bun run release:validate

      - name: Validate plugin schema
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.175
          bun run plugin:validate

      - name: Validate behavioral evaluation cases
        run: bun run eval:validate

      - name: Run tests
        run: bun test
