name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # Serialized, never cancelled: cancelling a main-branch run would kill its
  # validate-candidate job and leave a fully validated commit unreleased.
  # queue: max keeps later pushes pending (FIFO) instead of letting a newer
  # pending run replace this one, so every validated commit reaches release
  # creation without a manual rerun.
  group: release-pr-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  validate-candidate:
    uses: ./.github/workflows/ci.yml

  release-pr:
    needs: validate-candidate
    runs-on: ubuntu-latest
    outputs:
      cli_release_created: ${{ steps.release.outputs.release_created }}
      cli_tag_name: ${{ steps.release.outputs.tag_name }}
      cli_sha: ${{ steps.release.outputs.validated_sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create releases only from the validated commit
        id: release
        run: bun run scripts/release/create-validated-releases.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Maintain release PR
        uses: googleapis/release-please-action@v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          skip-labeling: false
          skip-github-release: true
          target-branch: main

  publish-cli:
    needs: release-pr
    # npm publishing is opt-in: set the repo variable NPM_PUBLISH=true after
    # claiming the package and adding the GitHub trusted publisher on npmjs.com.
    # Until then the CLI runs straight from GitHub: bunx github:sajor2000/methodsmith
    if: needs.release-pr.outputs.cli_release_created == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    concurrency:
      group: publish-${{ needs.release-pr.outputs.cli_tag_name }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-pr.outputs.cli_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Python test dependencies
        run: python3 -m pip install "openpyxl>=3.1,<4" "nbformat>=5.10,<6" "nbclient>=0.10,<1" "ipykernel>=6,<8" "PyYAML>=6,<7"

      - name: Typecheck
        run: bun run typecheck

      - name: Validate release metadata
        run: bun run release:validate

      - name: Run tests
        run: bun test

      - name: Setup Node.js for release
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer for the OIDC exchange.
      - name: Use an npm version with trusted publishing support
        run: npm install -g npm@11.5.1

      - name: Publish package
        run: npm publish --provenance --access public
