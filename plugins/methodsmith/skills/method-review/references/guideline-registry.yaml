# Source-document rule: reporting-guideline source documents (PDFs, Word files, supplements, articles)
# stay local and are never committed. Encode each as references/<name>-checklist.md with official item IDs
# and a source and licence header; copy verbatim only from CC BY or CC0 sources, otherwise paraphrase.
# Record the verification (source, date, status) in this registry.
# Newest-version rule: when a new version of a guideline is published, replace the old checklist in the same
# change, add the old name as an alias of the successor, and record the supersession (old citation, date) in the
# successor's supersedes note. Never keep two versions loadable; an old version name always resolves to its successor.
version: 1
description: Machine-readable source of truth for methodsmith reporting guideline coverage.
verification:
  verified_on: 2026-10-19
  evidence_statuses: [verified, provisional, unverified]
  evidence_sources: [pubmed, paperclip, equator, publisher]
  rule: A checklist is not authoritative merely because a local file exists; source identity, role, scope, and publication status must be verified.
evidence:
