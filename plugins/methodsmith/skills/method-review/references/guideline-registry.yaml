  STREGA: {title: STREGA, scope: genetic association reporting, role: extension, primary_citation: "Little et al. STREGA. Genet Epidemiol. 2009.", doi: 10.1002/gepi.20410, pmid: 19278015, pmcid: null, authoritative_url: https://pubmed.ncbi.nlm.nih.gov/19278015/, verification_date: 2026-10-19, status: verified, sources: [pubmed, paperclip, equator, publisher]}
  STROBE: {title: STROBE statement, scope: observational study reporting, role: primary, primary_citation: "von Elm et al. STROBE statement. Ann Intern Med. 2007.", doi: 10.7326/0003-4819-147-8-200710160-00010, pmid: 17938396, pmcid: null, authoritative_url: https://pubmed.ncbi.nlm.nih.gov/17938396/, verification_date: 2026-10-19, status: verified, sources: [pubmed, paperclip, equator, publisher]}
  STROBE-MR: {title: STROBE-MR, scope: Mendelian randomization reporting, role: extension, primary_citation: "Skrivankova et al. STROBE-MR statement. JAMA. 2021.", doi: 10.1001/jama.2021.18236, pmid: 34698778, pmcid: null, authoritative_url: https://pubmed.ncbi.nlm.nih.gov/34698778/, verification_date: 2026-10-19, status: verified, sources: [pubmed, paperclip, equator, publisher], note: "Stand-alone STROBE extension (20 items, 30 subitems); use instead of STROBE for MR studies. E&E BMJ 2021 PMID 34702754, PMC8546498"}
  TARGET: {title: TARGET statement, scope: observational studies emulating a target trial, role: primary, primary_citation: "Cashin et al. TARGET statement. BMJ. 2025.", doi: 10.1136/bmj-2025-087179, pmid: 40903028, pmcid: null, authoritative_url: https://pubmed.ncbi.nlm.nih.gov/40903028/, verification_date: 2026-10-19, status: verified, sources: [pubmed, paperclip, equator, publisher], current_reference: TARGET-2025, note: "Stand-alone; use instead of STROBE for target trial emulations. Simultaneous JAMA publication PMID 40899949, PMC13084563; EQUATOR page https://www.equator-network.org/reporting-guidelines/22462/ (the /target/ slug is a different guideline)"}
  TIDIER: {title: TIDieR checklist, scope: intervention description in any evaluative study design, role: extension, note: "Extends the intervention-description items of the trial guidelines (item 5 of CONSORT 2010 and item 11 of SPIRIT 2013, which CONSORT 2025 and SPIRIT 2025 replaced); applies alongside the current core. The BMJ copy carries no open licence, so item text is paraphrased", primary_citation: "Hoffmann et al. Better reporting of interventions: template for intervention description and replication (TIDieR) checklist and guide. BMJ. 2014;348:g1687.", doi: 10.1136/bmj.g1687, pmid: 24609605, pmcid: null, authoritative_url: https://pubmed.ncbi.nlm.nih.gov/24609605/, verification_date: 2026-10-19, status: verified, sources: [pubmed, publisher]}
