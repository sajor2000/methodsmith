  TRIPOD-LLM: {title: TRIPOD-LLM, scope: studies developing, fine-tuning, or evaluating large language models, role: extension, primary_citation: "Gallifant et al. The TRIPOD-LLM reporting guideline for studies using large language models. Nat Med. 2025.", doi: 10.1038/s41591-024-03425-5, pmid: 39779929, pmcid: PMC12104976, authoritative_url: https://pubmed.ncbi.nlm.nih.gov/39779929/, verification_date: 2026-10-19, status: verified, sources: [pubmed, publisher], note: "Applies to any LLM development, tuning, prompt engineering, or evaluation task, not only prediction models"}
