# sprint-log.yaml schema
# Lives at analysis/sprint-log.yaml (top-level; one file per project, with a `sprints:` list of entries — one per sprint)
# Per-sprint summary closeout reports live separately at analysis/sprints/<name>/summary.md
# analysis/sprint-log.yaml is the audit trail; scripts/sprint.py writes the fields marked (script).

sprints:
  - name: string                  # required, unique (script)
    status: open|pending_review|closed_pending_signoff|signed_off|abandoned
    reviewer: string              # named human reviewer; required at open (script, --reviewer)
    scope: [string]               # SAP section ids, e.g. ["SAP-3.3", "SAP-3.4"] (script, --scope)
    opened_at: ISO8601            # (script) set by `sprint.py open`
    commit_open: string           # (script) git HEAD at open
    outputs_planned:              # rows from sap-tables/02-outputs.csv; filled by the skill after open
      - id: string
        output_file: string       # path within subfolder
        subfolder: string         # tables/ figures/ etc.
        sap_section: string
    outputs_actual: [string]      # (script) starts empty
    closed_at: ISO8601            # (script) set by `sprint.py close`
    commit_close: string          # (script) git HEAD at close
    signed_off_at: ISO8601        # recorded by editing the YAML after human sign-off
    signed_off_by: string         # human name; required to move to signed_off

    entry_criteria:
      sap_version: string         # from analysis/sap.md frontmatter
      data_wave_id: string        # from analysis/data-waves.md (or .methodsmith/data-state.yaml); must be 'locked'
      prior_sprint: string        # name of prior sprint, or 'n/a' for first

    audit_reviewer_findings:      # populated on close
      P0: int
      P1: int
      P2: int
      out_of_scope_edits: [string]  # file paths edited but not in scope
      missing_outputs: [string]     # planned but not produced
      extra_outputs: [string]       # produced but not planned

    notes: string                 # optional free text
