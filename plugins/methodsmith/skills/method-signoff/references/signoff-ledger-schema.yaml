version: 2
readable_versions: [1, 2]
v2_entry_required_fields: [artifact_path, artifact_sha256]
legacy_note: Version 1 is structurally readable but does not bind approval to current content.
required_fields:
  - ledger_id
  - study_id
  - entries
entry_required_fields:
  - entry_id
  - reviewer
  - artifact
  - decision
  - timestamp
allowed_decisions:
  - approved
  - approved-with-conditions
  - changes-requested
  - rejected
