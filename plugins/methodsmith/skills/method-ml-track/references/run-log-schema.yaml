# Schema for disclosure-reviewed aggregate run summaries, not raw tracker mirrors.
# Complete sensitive logs/artifacts stay restricted and gitignored. Numeric fields
# may be null with a suppression reason in shared summaries; never encode as zero.
# Files at runs/<run-id>.yaml MUST conform to this schema.

run_id: string                    # UUID; matches backend run id when applicable
started: ISO8601                  # required
completed: ISO8601                # required (or "in_progress")
backend: mlflow|wandb|dvc|offline
backend_run_id: string            # backend-specific id; null for offline
study_id: string                  # links run to the SAP / project

params:
  train_data_sha: string          # SHA-256 of training data file (first 16 chars OK)
  test_data_sha: string          # final locked model only; null for exploratory runs
  git_sha: string                 # `git rev-parse HEAD` at run start
  random_seed: integer
  validation_type: bootstrap|nested-cv|internal-external|temporal|held-out
  split_strategy: group|temporal|random|not-applicable
  model_class: string             # recommended in run-schema.yaml; e.g., "lightgbm.LGBMClassifier"
  hyperparams: map                # model hyperparams as a flat map
  feature_count: integer
  n_configurations_evaluated: integer  # configurations tried so far in this experiment

metrics:
  n_train: integer
  n_events_train: integer
  auc_validation: float           # resampled discrimination; reported beside log loss
  log_loss_validation: float      # proper scoring rule; tuning and model-selection objective
  auprc_validation: float         # supplementary; interpret against prevalence
  auc_validation_scheme: string   # e.g., "grouped 5-fold CV by patient"
  instability_mape: float         # bootstrap prediction instability (development)
  # Test metrics below: held-out design and final locked model only, logged once;
  # null otherwise. Record resampling-corrected estimates for other designs.
  corrected_performance: map
  validation_procedure: string
  test_set_unlocked_at: ISO8601
  n_test: integer
  n_events_test: integer
  auc_test: float
  auc_test_ci_lo: float
  auc_test_ci_hi: float
  auprc_test: float               # supplementary; report with test prevalence
  net_benefit_test: map           # threshold -> net benefit on the locked test set
  auc_external: float             # null if no external set
  brier_test: float
  calibration_intercept_test: float  # calibration-in-the-large (offset model)
  calibration_slope_test: float
  subgroup_metrics:                 # recommended in run-schema.yaml
    - subgroup: string            # e.g., "sex_F"
      n: integer
      auc: float
      auc_ci_lo: float
      auc_ci_hi: float
      calibration_intercept: float
      calibration_slope: float

artifacts:
  # Reviewed aggregate artifacts only; restricted models/logs use opaque record IDs.
  - name: reviewed-aggregate.json
    path: string                  # non-revealing shareable artifact path
    sha: string
  - name: reviewed-aggregate-eval-results.json
    path: string
    sha: string
  - name: reviewed-calibration-plot.png
    path: string
    sha: string

# Optional but recommended
notes: string                     # what this run was trying to test
parent_run_id: string             # for hyperparameter sweeps; the sweep id
manuscript_candidate: bool        # set true when this run is the one going in the paper

disclosure:
  review_status: pending|approved|public-or-synthetic
  suppression_reason: string       # null if not needed; include related metrics
  restricted_record_id: string     # opaque id; no patient/revealing file path
