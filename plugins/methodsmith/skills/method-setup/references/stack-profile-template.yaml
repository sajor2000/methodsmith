# Stack Profile Template
# Schema for .methodsmith/config.local.yaml
#
# This file defines the available options for each stack profile field.
# The method-setup skill uses this as a reference when prompting users
# and validating their selections.
#
# Golden paths (tested, fully supported):
#   - R + tidyverse + Quarto
#   - Python + pandas + Jupyter
#   - CLIF + uv + clifpy/polars + Marimo/Jupyter
#
# Other combinations work but may lack optimized templates.

# .methodsmith/config.local.yaml
stack_profile:
  # Optional profile specialization.
  # clif - Common Longitudinal ICU data Format projects; activates CLIF-aware
  #        package prompts, Parquet defaults, and /method-clif downstream behavior.
  profile: clif | null

  clif:
    # Confirm one matching version family during CLIF setup.
    data_dictionary_version: "2.1.0" # 2.1.0 | 3.0.0
    mcide_version: "2.1.0"           # 2.1.0 | 3.0.0; normally matches the dictionary

  # Primary analysis language
  # r       - R only
  # python  - Python only
  # both    - R and Python (polyglot projects)
  language: r | python | both

  # Optional evidence-first setup handoff. Older profiles remain valid without
  # it; workflow uses it only to avoid re-asking high-confidence decisions.
  inference:
    language:
      value: r | python | both | unknown
      confidence: high | medium | low
      evidence: [pyproject.toml, analysis/model.py]
    data_domain:
      value: clif | omop | claims | bioinformatics | generic-ehr | generic-data
      confidence: high | medium | low
      evidence: [project signals]

  # Development environment
  # rstudio  - RStudio IDE
  # jupyter  - JupyterLab / Jupyter Notebook
  # marimo   - Marimo reactive notebooks
  # quarto   - Quarto documents (VS Code or RStudio)
  # vscode   - Visual Studio Code
  ide: rstudio | jupyter | marimo | quarto | vscode

  # Data manipulation libraries
  data_libraries:
    r: [tidyverse, data.table, arrow, here, jsonlite, knitr]
    python: [clifpy, pandas, polars, duckdb, pyarrow, pandera, sf-hamilton]

  # Data storage layer
  # parquet   - Local parquet files
  # database  - SQL database (PostgreSQL, SQLite, DuckDB, etc.)
  # fabric    - Microsoft Fabric / Spark
  data_layer: parquet | database | fabric

  # Optional verified database connection metadata. Connection-producing skills
  # can emit:
  # __CE_CONNECTION__ name=<name> type=<postgres|sqlite|duckdb|other> database=<db> auth=<auth> status=verified
  # method-setup uses that handoff as the default database context.
  data_connection:
    name: healthmap-connection
    type: postgres | sqlite | duckdb | other
    database: healthmap_dev
    auth: entra
    status: verified

  # Statistical and modeling packages
  statistical_packages:
    r: [stats, survival, lme4, gtsummary, gt, cmprsk, writexl, tidymodels, glmnet, survminer, brms, arrow, haven]
    python: [tableone, scipy, statsmodels, lifelines, scikit-learn, plotly, upsetplot]

  # Environment and dependency management
  # uv        - Python package and environment manager used by current CLIF repos
  # renv      - R environment manager (renv.lock for reproducible installs)
  # packrat   - Legacy R environment manager (pre-renv)
  # none      - No environment manager
  environment_manager:
    r: [renv, packrat, none]
    python: [uv, venv, conda, poetry, pixi, none]

  # R project type (only shown when language includes R)
  # script   - Analysis scripts (standalone .R files)
  # package  - R package structure (DESCRIPTION, NAMESPACE, man/)
  # shiny    - Shiny web application
  # plumber  - Plumber API
  # targets  - targets pipeline (_targets.R)
  r_project_type: script | package | shiny | plumber | targets

  # Reporting and output framework
  # quarto    - Quarto documents (.qmd)
  # rmarkdown - R Markdown (.Rmd)
  # marimo    - Marimo notebooks
  # jupyter   - Jupyter notebooks (.ipynb)
  reporting: quarto | rmarkdown | marimo | jupyter

  # Where local analysis datasets, materialized extracts, or cache files live.
  # For database-first projects, this may stay null; record concrete tables,
  # extracts, or query outputs in analysis/data-waves.md.
  # Used by method-data-qa and method-phi-leak-reviewer. PHI must NEVER be inside the repo tree -- if
  # data_root is repo-relative, the QA gate refuses any column matching PHI
  # patterns.
  # Examples:
  #   /Users/jcr/secure-data/study-x/        (absolute, off-repo)
  #   ~/Box Sync/study-x/data/                (cloud-mounted, off-repo)
  #   data/                                   (in-repo; only valid for SYNTHETIC data)
  data_root: null

  # Blinding state for the analysis. Drives method-review's --phase flag
  # (blinded EDA vs unblinded confirmatory) and gates SAP amendment review.
  # blinded   - Group labels masked; only descriptive code is allowed
  # unblinded - Confirmatory analysis allowed against the locked SAP
  # n/a       - Observational, single-arm, or otherwise not applicable
  blinding_state: blinded | unblinded | n/a

  # Reporting guideline integration. A non-null string enables
  # method-reporting-checklist-reviewer when a SAP exists.
  # Primary examples:
  #   CONSORT, STROBE, PRISMA, STARD, CARE, COREQ, ARRIVE, CHEERS, TRIPOD+AI
  # Extension examples:
  #   RECORD, RECORD-PE, CONSORT-AI, SPIRIT-AI, CLAIM, REFORMS, DEAL, CHART, PDSQI-9
  reporting_checklist: null
  reporting_checklist_extensions: []
