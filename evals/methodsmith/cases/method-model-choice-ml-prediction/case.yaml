schema_version: "1.0"
id: method-model-choice-ml-prediction
target:
  kind: skill
  name: method-model-choice
  source: plugins/methodsmith/skills/method-model-choice/SKILL.md
mode: forward
prompt_path: evals/methodsmith/cases/method-model-choice-ml-prediction/prompt.md
fixtures:
  - path: evals/methodsmith/cases/method-model-choice-ml-prediction/fixtures/aggregate-profile.md
    destination: workspace/aggregate-profile.md
    sha256: f83d7d1c5c996762f4ba61ce972a19638cedf8453ede595bd56acf3a3c5d7c40
required_behaviors:
  - memo-status-agrees
  - memo-validation-agrees
  - memo-outer-unit-agrees
  - memo-objective-agrees
  - memo-tuning-agrees
  - memo-sample-size-agrees
  - sidecar-version
  - sidecar-status
  - sidecar-validation
  - sidecar-tuning-nested
  - sidecar-sample-size
  - sidecar-calibration
  - sidecar-fixture-counts
  - sidecar-unresolved
  - sidecar-proper-objective
  - writes-decision-sidecar
  - writes-strategy-memo
  - writes-python-scaffold
  - essential-measures-named
  - auprc-supplementary-only
  - proper-tuning-objective
  - sample-size-checked
  - validation-design-declared
  - site-aware-validation
  - tuning-inside-resampling
  - scaffold-tuning-inside-resampling
  - calibration-assessed
  - calibration-method-named
  - instability-assessed
  - device-strategy-addressed
  - fixture-patient-count
  - fixture-event-count
  - fixture-site-count
  - fixture-predictor-count
  - shap-figures-named
  - permutation-importance-named
  - partial-dependence-named
  - scaffold-splits-stratified
  - evidence-ledger-preserved
  - emits-handoff
prohibited_behaviors:
  - no-primary-auprc-declaration
  - no-fabricated-metrics
  - no-imbalance-correction
  - no-cuda-install-plan
criteria:
  - id: memo-status-agrees
    description: Exactly one canonical memo status agrees with the sidecar.
    type: json_text_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: status
    text_path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: '^Status:[ \t]*([^\r\n]*)\r?$'
    case_sensitive: true
    weight: 2
    hard_gate: true
  - id: memo-validation-agrees
    description: The canonical validation-scheme row agrees with the sidecar.
    type: json_text_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: validation.scheme
    text_path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: '^Validation scheme:[ \t]*([^\r\n]*)\r?$'
    case_sensitive: true
    weight: 2
    hard_gate: true
  - id: memo-outer-unit-agrees
    description: The canonical outer-validation-unit row agrees with the sidecar.
    type: json_text_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: validation.outer_unit
    text_path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: '^Outer validation unit:[ \t]*([^\r\n]*)\r?$'
    case_sensitive: true
    weight: 2
    hard_gate: true
  - id: memo-objective-agrees
    description: The canonical objective row agrees with the selected proper score.
    type: json_text_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: tuning.objective
    text_path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: '^Objective:[ \t]*([^\r\n]*)\r?$'
    case_sensitive: true
    weight: 2
    hard_gate: true
  - id: memo-tuning-agrees
    description: The canonical tuning-location row agrees with the sidecar boolean.
    type: json_text_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: tuning.inside_resampling
    text_path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: '^Tuning inside resampling:[ \t]*([^\r\n]*)\r?$'
    case_sensitive: true
    weight: 2
    hard_gate: true
  - id: memo-sample-size-agrees
    description: The canonical sample-size-method row agrees with the sidecar.
    type: json_text_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: sample_size.method
    text_path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: '^Sample-size method:[ \t]*([^\r\n]*)\r?$'
    case_sensitive: true
    weight: 2
    hard_gate: true
  - id: sidecar-version
    description: The sidecar uses the supported decision contract version.
    type: json_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: schema_version
    expected: "1.0"
    weight: 1
    hard_gate: true
  - id: sidecar-status
    description: Complete frozen inputs support a ready-for-human-review strategy, not approval.
    type: json_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: status
    expected: ready_for_review
    weight: 2
    hard_gate: true
  - id: sidecar-validation
    description: The declared validation design respects the fixture's sites.
    type: json_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: validation
    expected: {scheme: internal_external_cv, outer_unit: site}
    weight: 2
    hard_gate: true
  - id: sidecar-tuning-nested
    description: Tuning is explicitly inside resampling; scaffold structure remains an independent gate.
    type: json_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: tuning.inside_resampling
    expected: true
    weight: 2
    hard_gate: true
  - id: sidecar-sample-size
    description: The Riley planning inputs use the frozen aggregate counts, not patient-level data.
    type: json_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: sample_size
    expected: {method: riley, inputs: {patients: 4180, events: 251, candidate_predictors: 22}}
    weight: 2
    hard_gate: true
  - id: sidecar-calibration
    description: Calibration assessment includes level, slope, and curve.
    type: json_set_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: calibration.methods
    expected: [calibration_in_the_large, calibration_slope, calibration_curve]
    weight: 2
    hard_gate: true
  - id: sidecar-fixture-counts
    description: All sidecar design counts match the frozen aggregate fixture with numeric types.
    type: json_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: fixture_counts
    expected: {patients: 4180, events: 251, sites: 14, candidate_predictors: 22}
    weight: 2
    hard_gate: true
  - id: sidecar-unresolved
    description: A ready-for-review recommendation has no unresolved design decisions.
    type: json_equals
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: unresolved
    expected: []
    weight: 2
    hard_gate: true
  - id: sidecar-proper-objective
    description: The selected tuning objective is log loss or Brier, never AUROC or AUPRC.
    type: json_one_of
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    json_path: tuning.objective
    expected: ["log_loss", "brier_score"]
    weight: 2
    hard_gate: true
  - id: writes-decision-sidecar
    description: A machine-readable decision sidecar accompanies the memo.
    type: file_exists
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.decisions.json
    expected: true
    weight: 3
    hard_gate: true
  - id: writes-strategy-memo
    description: A model-strategy memo is created.
    type: file_exists
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    expected: true
    weight: 3
    hard_gate: true
  - id: writes-python-scaffold
    description: A Python scaffold is created.
    type: file_exists
    path: workspace/analysis/model-strategy/sepsis-48h-model.py
    expected: true
    weight: 3
    hard_gate: true
  - id: essential-measures-named
    description: The memo plans clinical utility through net benefit or a decision curve alongside discrimination and calibration.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: 'net benefit|decision.?curve'
    weight: 3
    hard_gate: true
  - id: auprc-supplementary-only
    description: The memo does not make AUPRC or average precision the primary measure.
    type: claim_absent
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    subjects: [AUPRC, PR-AUC, PR AUC, average precision]
    claims: [primary]
    negation_pattern: '\b(?:not|never|cannot|can''t|isn''t|aren''t|don''t|doesn''t)\b'
    weight: 2
    hard_gate: false
  - id: no-primary-auprc-declaration
    description: An affirmative primary-measure declaration does not name AUPRC.
    type: claim_absent
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    subjects: [primary metric, primary performance metric, primary measure, primary performance measure, primary objective]
    claims: [AUPRC, PR-AUC, PR AUC, average precision]
    negation_pattern: '\b(?:not|never|cannot|can''t|isn''t|aren''t|don''t|doesn''t)\b'
    weight: 1
    hard_gate: false
  - id: proper-tuning-objective
    description: Hyperparameters are tuned on a proper scoring rule (log loss or Brier).
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: 'tun[^.\n]{0,160}(?:log.?loss|proper scoring|Brier)|(?:log.?loss|proper scoring)[^.\n]{0,160}tun|optimi[sz]\w*[^.\n]{0,160}(?:log.?loss|proper scoring|Brier)|(?:log.?loss|proper scoring|Brier)[^.\n]{0,160}(?:optimi[sz]\w*|minimi[sz]\w*|objective)'
    weight: 2
    hard_gate: true
  - id: sample-size-checked
    description: The memo grounds a real Riley sample-size check in its machinery (shrinkage, Nagelkerke R-squared, or pmsampsize near the Riley reference), not a bare keyword.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: '(?=[\s\S]*(?:Riley|pmsampsize))(?=[\s\S]*(?:shrinkage|Nagelkerke|R.?squared|Cox.?Snell|R\^\{?2\}?|R\u00B2))'
    weight: 2
    hard_gate: true
  - id: validation-design-declared
    description: The memo names the validation design (locked held-out set, nested CV, internal-external, or optimism-corrected resampling).
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: 'nested|held.?out|optimism|locked test|internal.?external'
    weight: 2
    hard_gate: true
  - id: site-aware-validation
    description: With 14 sites, the memo uses internal-external (leave-one-site-out) validation.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: 'internal.?external|leave.?one.?site|LeaveOneGroupOut'
    weight: 2
    hard_gate: true
  - id: tuning-inside-resampling
    description: The memo states that tuning happens inside resampling, not on outer or test data; the scaffold structure is gated separately.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: 'tun(?:e|es|ed|ing)[\s\S]{0,400}(?:fold|resampl|cross.?valid)|(?:fold|resampl|cross.?valid)[\s\S]{0,400}tun(?:e|es|ed|ing)'
    weight: 3
    hard_gate: true
  - id: scaffold-tuning-inside-resampling
    description: Parsed outer assessment loops must call a real search or explicit loss-based grid selector using only their training rows; helper names and unrelated inner loops never suffice.
    type: code_query
    language: python
    query: tuning_inside_resampling
    path: workspace/analysis/model-strategy/sepsis-48h-model.py
    weight: 3
    hard_gate: true
  - id: calibration-assessed
    description: The memo assesses calibration with slope, curve, or calibration-in-the-large.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: 'calibration (?:slope|curve|intercept)|calibration.?in.?the.?large'
    weight: 2
    hard_gate: true
  - id: calibration-method-named
    description: A concrete calibration method is named.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: 'isotonic|Platt|sigmoid|logistic recalibration|CalibratedClassifierCV|FrozenEstimator'
    weight: 2
    hard_gate: true
  - id: instability-assessed
    description: The memo plans a bootstrap instability assessment of predictions.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: 'instabilit|prediction stability'
    weight: 2
    hard_gate: true
  - id: device-strategy-addressed
    description: The memo anchors the compute plan to the fixture device context (the CPU-only LightGBM wheel), not a bare GPU or CUDA mention.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: 'CPU[^.\n]{0,60}(?:build|wheel|only|first|fit|LightGBM|core)|on (?:the )?CPU|compute plan[^.\n]{0,30}CPU'
    weight: 2
    hard_gate: true
  - id: fixture-patient-count
    description: The memo restates the frozen patient count (4,180) from the aggregate profile.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: '(?<!\d)4[,.]?180(?!\d)[\s\S]{0,30}patients'
    weight: 2
    hard_gate: true
  - id: fixture-event-count
    description: The memo restates the frozen event count (251) from the aggregate profile.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: '(?<!\d)251(?!\d)[\s\S]{0,40}events'
    weight: 2
    hard_gate: true
  - id: fixture-site-count
    description: The memo restates the frozen site count (14) from the aggregate profile.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: '(?:(?<!\d)14(?!\d)|\bfourteen\b)[\s\S]{0,20}sites'
    weight: 2
    hard_gate: true
  - id: fixture-predictor-count
    description: The memo restates the frozen candidate-predictor count (22) from the aggregate profile.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: '(?:(?<!\d)22(?!\d)|\btwenty[-\s]two\b)[\s\S]{0,30}predictors?'
    weight: 2
    hard_gate: true
  - id: shap-figures-named
    description: SHAP explanations are planned for the figures.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: 'SHAP'
    weight: 2
    hard_gate: true
  - id: permutation-importance-named
    description: Permutation importance is planned.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: 'permutation.{0,40}importance|importance[^.\n]{0,80}permut'
    weight: 2
    hard_gate: true
  - id: partial-dependence-named
    description: Partial dependence plots are planned.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: 'partial.?dependence|PartialDependence|\bPDPs?\b'
    weight: 2
    hard_gate: true
  - id: scaffold-splits-stratified
    description: The scaffold uses outcome-stratified or site-grouped splits with an explicit seed.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model.py
    pattern: 'Stratified|LeaveOneGroupOut|GroupKFold'
    weight: 2
    hard_gate: true
  - id: evidence-ledger-preserved
    description: The memo cites the performance-measure guidance anchor with its PMID.
    type: regex
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: 'PMID\s*41391983'
    weight: 3
    hard_gate: true
  - id: emits-handoff
    description: The response emits the canonical model-strategy handoff for Python.
    type: regex
    path: response.md
    pattern: '__CE_MODEL_STRATEGY__ .*language=python'
    weight: 3
    hard_gate: true
  - id: no-fabricated-metrics
    description: The scaffold contains no hard-coded performance values.
    type: regex_not
    path: workspace/analysis/model-strategy/sepsis-48h-model.py
    pattern: '\b(?:auc|auroc|auprc|accuracy|brier|log_loss|net_benefit)\b[''"]?\s*[:=]\s*0\.\d'
    weight: 2
    hard_gate: true
  - id: no-imbalance-correction
    description: The scaffold applies no resampling or class weighting for imbalance.
    type: regex_not
    path: workspace/analysis/model-strategy/sepsis-48h-model.py
    pattern: 'SMOTE|RandomOverSampler|RandomUnderSampler|is_unbalance\s*=\s*True|class_weight\s*=\s*[''"]balanced|scale_pos_weight\s*=\s*(?!1(?:\.0)?\b)[\w.(]'
    weight: 3
    hard_gate: true
  - id: no-cuda-install-plan
    description: The memo does not recommend installing a CUDA wheel or build against the fixture's CPU-only environment.
    type: regex_not
    path: workspace/analysis/model-strategy/sepsis-48h-model-strategy.md
    pattern: '(?<!\bnot\b[^.;\n]{0,40})(?<!\bnever\b[^.;\n]{0,40})(?<!\bavoid\w*[^.;\n]{0,40})(?<!\bwithout\b[^.;\n]{0,40})(?<!\bno\b[^.;\n]{0,40})(?<!\bdon''?t\b[^.;\n]{0,40})(?<!\bnor\b[^.;\n]{0,40})(?:install|reinstall)\w*[^.\n]{0,60}(?:CUDA|cuda)[- ]?(?:wheel|build|version|toolkit|enabled|support|package)|(?<!\bnot\b[^.;\n]{0,40})(?<!\bnever\b[^.;\n]{0,40})(?<!\bavoid\w*[^.;\n]{0,40})(?<!\bwithout\b[^.;\n]{0,40})(?<!\bno\b[^.;\n]{0,40})(?<!\bdon''?t\b[^.;\n]{0,40})(?<!\bnor\b[^.;\n]{0,40})(?:install|reinstall)\w*[^.\n]{0,60}\b(?:a|an|the)\s+(?:CUDA|cuda)\b'
    weight: 2
    hard_gate: true
threshold: 0.85
limitations:
  - Structured gates check the pilot fields and six canonical memo rows, not every JSON Schema constraint or arbitrary contradictions elsewhere in the narrative.
  - The sidecar cannot establish scaffold correctness. The structural tuning gate parses supported Python shapes and follows bounded data flow; it is not execution, full control-flow analysis, or a statistical code audit.
  - The fixture is synthetic and aggregate; the case evaluates protocol routing and scaffold structure, not fitted results or clinical validity.
  - Regex criteria verify that the right concepts are named, not that the reasoning is complete; a human reviewer still reads the memo.
  - The AUPRC claim checks use bounded clause/negation grammar and are not hard gates.
  - This fixture requests explicit loops over splitter outputs or simple cached split pairs. Enriched fold-record buffers, dynamic dispatch and other unsupported containers remain outside the static check.
